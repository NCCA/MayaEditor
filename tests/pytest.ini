[pytest]
# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Default markers
markers =
    unit: Pure Python tests (no Qt, no Maya execution)
    component: Qt widget tests (requires QApplication, may need Maya)
    integration: Full system tests (requires Maya + Qt)
    maya: Tests that execute Maya commands
    slow: Slow-running tests

# Test output
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes
    -ra

# Test discovery paths
testpaths = tests

# Logging
log_cli = true
log_cli_level = ERROR
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Ignore these paths
norecursedirs = .git .mypy_cache .ruff_cache __pycache__ .worktrees .omo
